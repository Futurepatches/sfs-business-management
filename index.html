<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFS Business Management</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="login" class="login-screen"><div class="login-card"><img src="logo.png" class="login-logo" alt="SFS"><div class="eyebrow">STANDARD FLUID SYSTEMS</div><h1>Business Management</h1><p class="muted">Inventory • Purchases • Sales • Customers</p><input id="loginUser" autocomplete="username" placeholder="Username"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button id="loginBtn" class="btn primary full" onclick="login()">Login</button><div id="loginError" class="error"></div></div></div>
<div id="app" class="hidden"><aside><div class="brand"><img src="logo.png" alt="SFS"><div><b>SFS</b><small>Business Management</small></div></div><nav id="nav"></nav><div class="userbox"><b id="who"></b><small id="role"></small><button class="btn ghost full" onclick="logout()">Logout</button></div></aside><main><header><div><div class="eyebrow">STANDARD FLUID SYSTEMS</div><h1 id="pageTitle">Dashboard</h1><p>Inventory • Purchases • Sales • Documents</p></div><div class="header-actions"><span id="busy" class="busy hidden">Working…</span><button class="btn ghost" onclick="refresh()">↻ Refresh</button></div></header><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toastHost" class="toast-host"></div><div id="printArea"></div><script src="config.js"></script><script src="app.js"></script><script src="price-list.js"></script><script src="erp-overrides.js"></script></body></html>
