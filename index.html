<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFS Business Management</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="login" class="login-screen"><div class="login-card"><img src="logo.png" class="login-logo"><h1>SFS Business Management</h1><input id="loginApi" placeholder="Apps Script Web App URL (first setup only)"><input id="loginUser" placeholder="Username"><input id="loginPass" type="password" placeholder="Password"><button class="btn primary full" onclick="login()">Login</button><div id="loginError" class="error"></div><small>Initial admin: admin / admin123 — change it after first login.</small></div></div>
<div id="app" class="hidden"><aside><div class="brand"><img src="logo.png"><div><b>SFS</b><small>Business Management</small></div></div><nav id="nav"></nav><div class="userbox"><b id="who"></b><small id="role"></small><button class="btn ghost full" onclick="logout()">Logout</button></div></aside><main><header><div><h1 id="pageTitle">Dashboard</h1><p>Inventory • Purchases • Sales • Documents</p></div><button class="btn ghost" onclick="refresh()">↻ Refresh</button></header><div id="content"></div></main></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="printArea"></div><script src="app.js"></script></body></html>
